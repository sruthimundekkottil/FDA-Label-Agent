name: CI

# Lint + tests on every push. Tests need no API key and no data:
# models are scripted, retrievers stubbed, and data/ is not in git.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Fail loudly if any test tries to download a model.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # No key exists here; force the offline model in case anything asks for one.
      LLM_MOCK: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python (with pip download cache)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch via the index in requirements.txt)
        run: python -m pip install -r requirements.txt

      - name: Lint with ruff
        run: python -m ruff check . --output-format github

      - name: Run tests
        run: python -m pytest -q -rs
